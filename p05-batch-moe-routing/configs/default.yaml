# P5 — Batch-Aware MoE Expert Routing at Inference
# Verdict (research.md): PIVOT/deprioritize — heavily scooped (OEA/Lynx/SERE/XShare).
# Only defensible slice: the end-to-end vLLM throughput study OEA never did.
# NOTE: the goal is training-free routing measured by WALL-CLOCK vs vLLM, not FLOP proxies.

base_model: "Qwen/Qwen1.5-MoE-A2.7B"   # open MoE; needs quant/offload on one 40GB A100
seed: 42
device: auto

# MoE / routing
num_experts: 60          # Qwen1.5-MoE-A2.7B
top_k_experts: 4
routing_strategy: baseline   # baseline | opportunistic | similarity | budget
expert_budget: 0             # batch-wide cap on unique active experts (0 = uncapped)

# Inference workload
max_new_tokens: 256
batch_sizes: [1, 4, 16, 64]  # profile union-of-experts growth with batch size
serving_baseline: vllm       # the load-bearing metric is tokens/s + peak mem vs this

output_dir: "results/run-001"
log_interval: 5
