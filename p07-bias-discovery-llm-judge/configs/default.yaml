# P7 — Automated Discovery of Novel Biases in LLM-as-Judge
# Verdict (research.md): PIVOT. BiasScope (ICLR 2026) scoops the discovery framing.
# Defensible residual: CAUSAL validation in the code-judge domain, where unit-test
# pass/fail makes "answer quality held fixed" ground truth rather than an approximation.

judge_model: "gpt-4o-mini"        # the judge under audit
seed: 42
device: auto

# Causal bias-discovery setup
testbed: codejudgebench           # execution-verifiable quality
perturbation_model: "gpt-4o"      # generates quality-preserving counterfactuals
candidate_bias_factors:           # discovery seeds — goal is to find NEW ones too
  - position
  - verbosity
  - self_preference
  - authority
  - formatting
n_perturbations_per_pair: 8
n_bootstrap: 1000                 # bootstrap CIs for the flip-rate ATE

# Judge call settings
temperature: 0.0                  # greedy for reproducibility
max_new_tokens: 512

output_dir: "results/run-001"
log_interval: 5
