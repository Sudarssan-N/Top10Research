# P6 — Context-Length-Induced Degradation Under Perfect Retrieval
# Verdict (research.md): PIVOT/sharpen. The contribution is the MECHANISM, not the
# already-published reorder/calibrate mitigations. Keep retrieval PERFECT (gold always
# present) and orthogonalize token-count vs. absolute evidence position.

base_model: "Qwen/Qwen2.5-7B-Instruct"   # real long-context window
seed: 42
device: auto

# Controlled length-vs-position 2x2+ design
context_lengths: [1000, 4000, 16000, 64000]   # total context size (tokens)
evidence_positions: [0.0, 0.25, 0.5, 0.75, 1.0]  # relative placement of gold evidence
num_distractors: 0          # filler items; retrieval stays perfect (gold never dropped)
eval_task: niah_qa          # certified-perfect-retrieval QA probe

# Training-free mitigation under test
mitigation: none            # none | reorder | attn_calibrate | recitation
max_new_tokens: 64

output_dir: "results/run-001"
log_interval: 5
