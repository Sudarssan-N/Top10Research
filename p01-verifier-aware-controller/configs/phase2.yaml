# P1 Phase 2 — frozen feature extraction + controller pretrain on labels
base_model: "Qwen/Qwen2.5-1.5B-Instruct"
seed: 42
device: auto
max_new_tokens: 512
temperature: 0.7

benchmarks:
  - gsm8k
  - math500

data_dir: "data"
feature_pooling: "last_token"
label_n: 8
n_samples_best_of_n: 8

controller_hidden_dim: 128
num_controller_layers: 2
train_batch_size: 8
learning_rate: 1.0e-4
num_epochs: 3
trust_loss_weight: 0.5
val_fraction: 0.15

output_dir: "results/phase2"

# Smoke:  python scripts/run_phase2.py --smoke-test
# Extract: python scripts/run_phase2.py --mode extract --max-examples 50 --mock
# GPU:     python scripts/run_phase2.py --mode extract --max-examples 100 --label-n 8
# Train:   python scripts/run_phase2.py --mode train
# Both:    python scripts/run_phase2.py --mode both --max-examples 100