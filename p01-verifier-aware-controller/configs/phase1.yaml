# P1 Phase 1 — baseline reproduction (no controller)
base_model: "Qwen/Qwen2.5-1.5B-Instruct"
seed: 42
device: auto
max_new_tokens: 512
temperature: 0.7

# Eval scope — start small; remove max_examples cap for full runs
benchmarks:
  - gsm8k
  - math500
n_samples_best_of_n: 16

output_dir: "results/phase1"
log_interval: 10

# Suggested CLI for first real GPU run (20 examples):
#   python scripts/run_phase1_baselines.py --config configs/phase1.yaml --max-examples 20 --n-values 1,4,8
#
# Full run:
#   python scripts/run_phase1_baselines.py --config configs/phase1.yaml --n-values 1,2,4,8,16